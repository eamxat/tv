<style>
/* ===== Tokens de tema (mismo sistema del frame de referencia) ===== */
:root{--g:1;--accent:#ff9436;--a2:#ffb067;--pt:18,19,23;--pb:10,11,14;--ht:24,25,30;--hb:14,15,19;--line:rgba(255,255,255,.08);--deep:#09090b;
--tx:#f9fafb;--ts:#d1d5db;--tm:#8b8f9c;--bt:#1c1d22;--bb:#121317;--gt:#ff9d3b;--gb:#d96514;--amb:rgba(255,148,54,.16);--hov:rgba(255,148,54,.08);
--sh:0 24px 38px -18px rgba(0,0,0,.92),0 8px 18px -8px rgba(0,0,0,.7),inset 0 1px 0 rgba(255,255,255,.06)}
[data-theme=light]{--accent:#c9560a;--a2:#b84b05;--pt:250,250,252;--pb:238,240,245;--ht:255,255,255;--hb:242,243,247;--line:rgba(0,0,0,.1);--deep:#e4e6ed;--tx:#111827;--ts:#374151;--tm:#6b7280;--bt:#fff;--bb:#f1f2f6;--amb:rgba(235,115,30,.12);--hov:rgba(235,115,30,.08);--sh:0 22px 30px -20px rgba(15,23,42,.25),inset 0 1px 0 rgba(255,255,255,.8)}
[data-theme=cyan]{--accent:#06b6d4;--a2:#67e8f9;--pt:14,27,36;--pb:8,16,22;--ht:18,34,45;--hb:10,20,28;--line:rgba(56,189,248,.16);--deep:#060e14;--bt:#0e1c24;--bb:#0a141a;--gt:#22d3ee;--gb:#0284c7;--amb:rgba(6,182,212,.22);--hov:rgba(6,182,212,.1);--tm:#6892a0}
[data-theme=pink]{--accent:#ff5ca8;--a2:#ff94c6;--pt:31,15,27;--pb:16,8,14;--ht:38,19,33;--hb:22,10,19;--line:rgba(255,110,180,.16);--deep:#10060d;--bt:#281523;--bb:#170b14;--gt:#ff6bb5;--gb:#c91e72;--amb:rgba(255,92,168,.22);--hov:rgba(255,92,168,.1);--tm:#a3728e}
[data-theme=purple]{--accent:#a855f7;--a2:#d8b4fe;--pt:24,15,36;--pb:13,8,20;--ht:30,19,45;--hb:17,10,27;--line:rgba(185,130,255,.16);--deep:#0b0612;--bt:#201630;--bb:#120b1d;--gt:#b366ff;--gb:#7e22ce;--amb:rgba(168,85,247,.22);--hov:rgba(168,85,247,.1);--tm:#8f7aa8}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{overflow:hidden;font-family:'Poppins',ui-sans-serif,system-ui,sans-serif;color:var(--tx);-webkit-font-smoothing:antialiased;background:radial-gradient(900px 480px at 15% -10%,var(--amb),transparent),var(--deep)}
button,input,select{font-family:inherit;color:inherit}
button{-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mut{color:var(--tm);font-size:12px;margin:8px 4px}
/* ===== Frame fijo 1303×608 escalado a la ventana ===== */
#frame{position:absolute;width:1303px;height:608px;transform-origin:top left}
header{position:absolute;top:12px;left:24px;right:24px;height:34px;display:flex;align-items:center;gap:10px;z-index:50}
.brand{font-weight:700;font-size:17px;letter-spacing:-.02em;display:flex;align-items:center;gap:8px;margin-right:6px;white-space:nowrap}
.brand i{width:22px;height:16px;border:2px solid var(--accent);border-radius:5px;position:relative;display:inline-block}
.brand i:after{content:"";position:absolute;left:50%;top:-7px;width:8px;height:5px;border:2px solid var(--accent);border-bottom:0;border-radius:6px 6px 0 0;transform:translateX(-50%)}
#nav{display:flex;gap:6px;padding:4px;border-radius:999px;border:1px solid var(--line);background:linear-gradient(180deg,rgba(var(--ht),calc(.92*var(--g))),rgba(var(--hb),calc(.92*var(--g))));backdrop-filter:blur(calc(6px + (1 - var(--g))*12px))}
.btn{height:26px;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:0 14px;border-radius:999px;cursor:pointer;font-size:12px;font-weight:600;white-space:nowrap;color:var(--tx);background:linear-gradient(180deg,var(--bt),var(--bb));border:1px solid var(--line);transition:filter .15s,transform .15s}
.btn:hover:not(:disabled){filter:brightness(1.2)}.btn:active:not(:disabled){transform:scale(.97)}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn.gold,#nav button.on{background:linear-gradient(180deg,var(--gt),var(--gb));border-color:rgba(255,200,140,.45);color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.35)}
#nav button{border:0;background:transparent;box-shadow:none;height:24px;padding:0 13px;color:var(--ts)}
#nav button.on{color:#fff}
.sp1{flex:1}
.pill{height:26px;display:flex;align-items:center;gap:6px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:rgba(var(--ht),var(--g))}
.pill input{background:none;border:0;outline:0;width:160px;font-size:12px;color:var(--tx)}
#ap{display:none;position:absolute;right:0;top:34px;align-items:center;gap:8px;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:rgb(var(--ht));box-shadow:var(--sh);font-size:11px;font-weight:600;color:var(--ts)}
#ap.open{display:flex}
.dot{width:16px;height:16px;border-radius:50%;border:2px solid transparent;cursor:pointer;padding:0}.dot.on{border-color:#fff;box-shadow:0 0 0 1px var(--accent)}
#glass{width:80px;accent-color:var(--accent)}
/* ===== Paneles de vidrio ===== */
main{position:absolute;top:56px;left:24px;right:24px;bottom:30px;display:flex;gap:12px}
.sec{position:relative;border-radius:26px;border:1px solid var(--line);display:flex;flex-direction:column;min-height:0;overflow:hidden;
background:radial-gradient(120% 55% at 50% 0%,var(--amb),transparent 70%),linear-gradient(180deg,rgba(var(--pt),var(--g)),rgba(var(--pb),var(--g)));box-shadow:var(--sh);backdrop-filter:blur(calc((1 - var(--g))*14px))}
#side{width:340px;flex:none;padding:14px}
#stage{flex:1;min-width:0}
.pg{padding:18px 20px;overflow:auto;flex:1;scrollbar-width:thin;scrollbar-color:var(--accent) transparent}
h1{font-size:30px;line-height:1.1;margin:0 0 8px;letter-spacing:-.02em}

h3:after{content:"";height:2px;width:34px;background:var(--accent);border-radius:2px}
.in,select{height:30px;border-radius:999px;border:1px solid var(--line);background:rgba(0,0,0,.25);padding:0 12px;font-size:12px;outline:0;min-width:0}
select option{background:#16171b;color:#f3f4f6}

.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.list{overflow:auto;flex:1;margin-top:4px;scrollbar-width:thin;scrollbar-color:var(--accent) transparent}
.rc{display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:14px;cursor:pointer;border:1px solid transparent}
.rc:hover{background:var(--hov)}.rc.on{border-color:var(--accent);background:var(--hov)}
.rc img,.logo{width:38px;height:38px;object-fit:contain;border-radius:9px;background:rgba(255,255,255,.07);flex:none}
.rc b{flex:1;font-size:12.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.fv.on{color:#ffc933}
/* ===== Tarjetas, carruseles y rejillas ===== */
.row{display:flex;gap:12px;overflow-x:auto;padding-bottom:8px;scrollbar-width:thin;scrollbar-color:var(--accent) transparent;scroll-snap-type:x proximity}
.row .card,.row .cc{flex:none;width:118px;scroll-snap-align:start}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:14px}
.card{position:relative;cursor:pointer;border-radius:14px;transition:transform .18s}
.card:hover{transform:translateY(-3px)}
.card img,.np{width:100%;aspect-ratio:2/3;object-fit:cover;border-radius:14px;background:rgba(255,255,255,.06);display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--tm);border:1px solid var(--line)}
.card b{display:block;font-size:11.5px;margin-top:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card small{color:var(--tm);font-size:10.5px}
.card .fv{position:absolute;top:6px;right:6px}
.cc{cursor:pointer;text-align:center;padding:12px 6px;border-radius:16px;border:1px solid var(--line);background:rgba(255,255,255,.03)}
.cc:hover{border-color:var(--accent)}
.cc img{width:64px;height:64px;object-fit:contain;display:block;margin:0 auto 6px}
.cc b{font-size:11px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hero{border-radius:22px;padding:26px 28px;border:1px solid var(--line);background:linear-gradient(110deg,var(--amb),transparent 70%),rgba(255,255,255,.03)}
.hero p{margin:0 0 16px;color:var(--ts);font-size:13px;max-width:440px}
.acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tb{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}.tb .in{flex:1;min-width:140px}
.note{border:1px dashed var(--accent);border-radius:16px;padding:14px 16px;font-size:12px;color:var(--ts)}
.note b{color:var(--tx);font-size:13px}.note p{margin:6px 0 10px}.note .in{flex:1;min-width:200px}
/* ===== Reproductor ===== */
.tvwrap{display:flex;flex-direction:column;flex:1;min-height:0;padding:14px;gap:10px}
.pb{position:relative;background:#000;border-radius:18px;overflow:hidden;flex:1;min-height:0}
.pb video{width:100%;height:100%;object-fit:contain;display:block;background:#000}
.ov{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:20px;background:rgba(0,0,0,.72);font-size:13px;color:#e5e7eb}
.ov.show{display:flex}.ov .btn{height:28px}
.spin{width:34px;height:34px;border-radius:50%;border:3px solid rgba(255,255,255,.2);border-top-color:var(--accent);animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.ctl{position:absolute;left:0;right:0;bottom:0;display:flex;align-items:center;gap:8px;padding:22px 12px 10px;background:linear-gradient(transparent,rgba(0,0,0,.85));opacity:0;transition:opacity .2s;color:#fff}
.pb:hover .ctl,.pb:focus-within .ctl,.pb.paused .ctl{opacity:1}
@media(hover:none){.ctl{opacity:1}}
.cb{background:rgba(255,255,255,.14);border:0;color:#fff;width:30px;height:30px;border-radius:50%;cursor:pointer;font-size:12px}
.cb:hover{background:var(--accent)}
.vol{width:70px;accent-color:var(--accent)}.seek{flex:1;accent-color:var(--accent)}
.live{font-size:11px;font-weight:700;color:#ff4d4d;white-space:nowrap}
.ctl select{height:26px;font-size:11px;background:rgba(0,0,0,.5);color:#fff}
.tm{font:600 11px ui-monospace,monospace;white-space:nowrap}
.cinfo{display:flex;align-items:center;gap:12px;min-height:74px;padding:2px 6px}
.cinfo .logo{width:52px;height:52px}.cinfo .t{flex:1;min-width:0}
.cinfo b{font-size:15px}.cinfo p{margin:2px 0 0;font-size:11.5px;color:var(--ts)}
.badge{font-size:10px;font-weight:700;color:#fff;background:#e11d48;border-radius:6px;padding:2px 7px;margin-left:8px;vertical-align:middle}
/* ===== Modal ===== */
#modal{position:absolute;inset:0;z-index:100;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.65);backdrop-filter:blur(4px)}
#modal.open{display:flex}
#mbox{position:relative;width:min(820px,94%);max-height:92%;overflow:auto;border-radius:24px;border:1px solid var(--line);background:linear-gradient(180deg,rgb(var(--pt)),rgb(var(--pb)));padding:22px;box-shadow:var(--sh)}
.x{position:absolute;top:12px;right:12px;width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:rgba(0,0,0,.4);cursor:pointer;z-index:2}
.dh{display:flex;gap:18px}.dh>img{width:150px;aspect-ratio:2/3;object-fit:cover;border-radius:14px;flex:none}
.dh h2{margin:0 0 4px;font-size:22px}.dh p{font-size:12.5px;color:var(--ts);line-height:1.5}
.mp{aspect-ratio:16/9;margin-bottom:14px;display:flex}.mp .pb{flex:1}.mp[hidden]{display:none}
.ep{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:12px}
.ep span{flex:1}.ep small{display:block;color:var(--tm)}
footer{position:absolute;left:0;right:0;bottom:8px;text-align:center;font-size:10.5px;color:var(--tm);padding:0 24px}
footer a,.note a,#mbox a{color:var(--a2)}
table{width:100%;border-collapse:collapse;font-size:12px}td{padding:6px 4px;border-bottom:1px solid var(--line);vertical-align:top}
/* ===== Móvil/tableta: diseño fluido ===== */
html.m body{overflow:auto;height:auto}
html.m #frame{position:relative;width:100%;height:auto;transform:none!important;left:0!important;top:0!important}
html.m header{position:relative;top:0;left:0;right:0;height:auto;flex-wrap:wrap;padding:10px 12px}
html.m #nav{order:5;width:100%;overflow-x:auto}
html.m .pill input{width:110px}
html.m main{position:relative;top:0;left:0;right:0;bottom:0;flex-direction:column;padding:0 10px 10px}
html.m #side{width:auto;max-height:44vh}
html.m .pb{flex:none;aspect-ratio:16/9}
html.m .tvwrap{flex:none}
html.m footer{position:static;padding:6px 12px 16px}
html.m #modal{position:fixed}
html.m .dh{flex-direction:column}.dh>img{width:120px}
html.m h1{font-size:24px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<div id="frame">

<script>
(()=>{'use strict';
/* ============================================================================
   1. CONFIGURACIÓN CENTRALIZADA DE FUENTES  (edita SOLO esta sección)
   ----------------------------------------------------------------------------
   · channelSources: listas M3U públicas de IPTV-org (se leen en vivo, no se copian).
     IPTV-org NO garantiza que cada señal esté autorizada para retransmisión.
     Usa onlyApproved:true + approved:[ids tvg-id] para mostrar solo señales cuya
     licencia hayas verificado tú.
   · epgUrl: URL de un XMLTV (https, con CORS). Vacío = sin guía de programación.
   · tmdbKey: opcional. Si queda vacío, cada visitante pega su propia clave v3 (se
     guarda solo en su navegador). Nunca pongas claves privadas aquí.
   · playback: ÚNICO lugar donde se conectan películas/episodios. Vacío a propósito:
     no hay fuentes verificadas. Formato:
       movie:{ "603":[{label:"Dominio público",url:"https://…/peli.m3u8",format:"hls"}] }
       episode:{ "1399-1-1":[{label:"…",url:"https://…/ep.mp4",format:"mp4"}] }  // tmdbId-temporada-episodio
     Solo contenido de dominio público o de proveedores que permitan expresamente incrustarlo.
   ============================================================================ */
const BASE='https://iptv-org.github.io/iptv/';
const CONFIG={
  channelSources:[
    {cat:'Nacionales',url:BASE+'countries/mx.m3u'},
    {cat:'Internacionales',url:BASE+'languages/spa.m3u'},
    {cat:'Noticias',url:BASE+'categories/news.m3u'},
    {cat:'Entretenimiento',url:BASE+'categories/entertainment.m3u'},
    {cat:'Cultura',url:BASE+'categories/culture.m3u'},
    {cat:'Documentales',url:BASE+'categories/documentary.m3u'}
  ],
  onlyApproved:false, approved:[],
  epgUrl:'',
  tmdbKey:'',
  playback:{movie:{},episode:{}},
  external:[
    {name:'MXPlus',status:'Pendiente de autorización',how:'Sin API pública de inserción conocida. Solo se integrará si el proveedor autoriza por escrito la reproducción externa; entonces agrega su URL oficial en channelSources o playback.'},
    {name:'Pluto TV',status:'Pendiente de autorización',how:'No se usan endpoints internos ni enlaces privados. Requiere acuerdo de distribución o un reproductor/embed oficial.'}
  ]
};

/* ============================================================================
   2. UTILIDADES, ESTADO Y PERSISTENCIA (localStorage; sin cuentas ni datos personales)
   ============================================================================ */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LS={get(k,d){try{const v=JSON.parse(localStorage.getItem(k));return v??d}catch{return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}};
/* Valida URLs de reproducción: HTTPS obligatorio en páginas HTTPS (contenido mixto bloqueado) */
const okUrl=u=>{try{const x=new URL(u);return x.protocol==='https:'||(x.protocol==='http:'&&location.protocol!=='https:')}catch{return false}};
const safeImg=u=>okUrl(u)?esc(u):'';
const st0=LS.get('wtv-favs',{});const favs={ch:st0.ch||{},movie:st0.movie||{},tv:st0.tv||{}};
let view='home',tvCat='Nacionales',P=null,MP=null,curCh=null,pending=null,mk='movie';
let key=LS.get('wtv-key','')||CONFIG.tmdbKey;
const CH={},byId={},MED={},memo=new Map(),F={movie:{q:'',genre:'',year:'',page:1},tv:{q:'',genre:'',year:'',page:1}};
const isFav=(k,id)=>!!favs[k][id];
const country=c=>{try{return new Intl.DisplayNames(['es'],{type:'region'}).of(c.toUpperCase())}catch{return c}};

/* ============================================================================
   3. CANALES: lectura M3U, agrupación, caché y EPG (XMLTV opcional)
   ============================================================================ */
function parseM3U(t){const out=[];let m=null;
  for(const raw of t.split('\n')){const l=raw.trim();
    if(l.startsWith('#EXTINF')){const a=k=>(l.match(new RegExp(k+'="([^"]*)"'))||[])[1]||'';
      m={tid:a('tvg-id'),logo:a('tvg-logo'),grp:a('group-title'),name:l.slice(l.lastIndexOf(',')+1).trim()}}
    else if(m&&l&&l[0]!=='#'){if(okUrl(l)){m.url=l;out.push(m)}m=null}}
  return out}
function group(items,cat){const map=new Map();
  for(const i of items){const k=i.tid||i.name;let c=map.get(k);
    if(!c){const epg=i.tid.split('@')[0];c={id:cat+'|'+k,name:i.name.replace(/\s*\[.*?\]/g,'')||i.name,logo:i.logo,cat,grp:i.grp,cc:epg.split('.').pop(),epg,urls:[]};map.set(k,c)}
    if(c.urls.length<4)c.urls.push({url:i.url,label:'Fuente '+(c.urls.length+1)})}
  return [...map.values()]}
function reg(cat,l){if(CONFIG.onlyApproved)l=l.filter(c=>CONFIG.approved.includes(c.epg));CH[cat]=l;l.forEach(c=>byId[c.id]=c);return l}
async function fetchCat(src){
  if(CH[src.cat])return CH[src.cat];
  const c=LS.get('wtv-c-'+src.cat,null);if(c&&Date.now()-c.t<216e5)return reg(src.cat,c.d);   // caché 6 h
  const r=await fetch(src.url);if(!r.ok)throw new Error('HTTP '+r.status);
  const list=group(parseM3U(await r.text()),src.cat).slice(0,400);
  LS.set('wtv-c-'+src.cat,{t:Date.now(),d:list});return reg(src.cat,list)}
let EPG=null;
const xt=s=>{const m=(s||'').match(/(\d{4})(\d\d)(\d\d)(\d\d)(\d\d)(\d\d)\s*([+-]\d{4})?/);if(!m)return 0;const z=m[7]?m[7].slice(0,3)+':'+m[7].slice(3):'Z';return Date.parse(`${m[1]}-${m[2]}-${m[3]}T${m[4]}:${m[5]}:${m[6]}${z}`)};
async function loadEpg(){if(!CONFIG.epgUrl||EPG)return;EPG={};
  try{const r=await fetch(CONFIG.epgUrl);const x=new DOMParser().parseFromString(await r.text(),'text/xml');const a=Date.now()-36e5,b=Date.now()+864e5;
    $$('programme',x).forEach(p=>{const s=xt(p.getAttribute('start')),e=xt(p.getAttribute('stop'));if(e<a||s>b)return;(EPG[p.getAttribute('channel')]??=[]).push({s,e,t:p.querySelector('title')?.textContent||''})});
    Object.values(EPG).forEach(l=>l.sort((a,b)=>a.s-b.s))}catch{}}
function nowNext(ch){const l=EPG&&EPG[ch.epg];if(!l)return null;const n=Date.now(),i=l.findIndex(p=>p.s<=n&&n<p.e);return i<0?null:{now:l[i],next:l[i+1]}}

/* ============================================================================
   4. REPRODUCTOR (HLS.js + nativo): reconexión, calidad, errores, limpieza
   ============================================================================ */
function mkPlayer(box,{live}){
  box.classList.add('pb');
  box.innerHTML=`<video playsinline></video><div class="ov"></div><div class="ctl">
  <button class="cb" data-c="pp" aria-label="Reproducir o pausar">▶</button><button class="cb" data-c="mu" aria-label="Silenciar">♪</button>
  <input class="vol" type="range" min="0" max="1" step=".05" value="1" aria-label="Volumen">
  ${live?'<span class="live">● EN VIVO</span><span style="flex:1"></span>':'<span class="tm" data-t="cur">0:00</span><input class="seek" type="range" min="0" max="1000" value="0" aria-label="Progreso"><span class="tm" data-t="dur">0:00</span>'}
  <select class="ql" title="Calidad" hidden></select><button class="cb" data-c="fs" aria-label="Pantalla completa">⛶</button></div>`;
  const v=$('video',box),ov=$('.ov',box),ql=$('.ql',box),seek=$('.seek',box);
  let hls=null,tries=0,list=[],si=0,dead=false;
  const fmt=s=>isFinite(s)?Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0'):'0:00';
  const show=h=>{ov.className='ov show';ov.innerHTML=h}, hide=()=>{ov.className='ov'};
  const clean=()=>{if(hls){hls.destroy();hls=null}v.pause();v.removeAttribute('src');v.load();ql.hidden=true};
  function fail(m){clean();const more=list.length>1;
    show(`<div>⚠ ${esc(m||'No se pudo reproducir esta señal. Puede estar caída, bloqueada por región o por CORS.')}</div><div class="acts"><button class="btn" data-o="retry">Reintentar</button>${more?'<button class="btn gold" data-o="next">Probar otra fuente ('+(si+1)+'/'+list.length+')</button>':''}</div>`)}
  function start(){clean();tries=0;const s=list[si];if(!s||!okUrl(s.url))return fail('URL no válida o sin HTTPS.');
    show('<div class="spin"></div><div>Conectando…</div>');
    const isHls=s.format==='hls'||/\.m3u8|hls/i.test(s.url);
    if(isHls&&window.Hls&&Hls.isSupported()){
      hls=new Hls({maxBufferLength:20,lowLatencyMode:false});hls.loadSource(s.url);hls.attachMedia(v);
      hls.on(Hls.Events.MANIFEST_PARSED,(_,d)=>{if(d.levels.length>1){ql.innerHTML='<option value="-1">Auto</option>'+d.levels.map((l,i)=>`<option value="${i}">${l.height?l.height+'p':Math.round(l.bitrate/1e3)+'k'}</option>`).join('');ql.hidden=false}v.play().catch(()=>{})});
      hls.on(Hls.Events.ERROR,(_,d)=>{if(!d.fatal)return;
        if(d.type===Hls.ErrorTypes.NETWORK_ERROR&&tries++<3){show('<div class="spin"></div><div>Reconectando… ('+tries+'/3)</div>');setTimeout(()=>hls&&hls.startLoad(),1500*tries)}
        else if(d.type===Hls.ErrorTypes.MEDIA_ERROR&&tries++<3)hls.recoverMediaError();
        else fail()})}
    else if(!isHls||v.canPlayType('application/vnd.apple.mpegurl')){v.src=s.url;v.play().catch(()=>{})}
    else fail('Tu navegador no admite HLS.')}
  v.addEventListener('playing',hide);v.addEventListener('waiting',()=>{if(!v.paused)show('<div class="spin"></div>')});
  v.addEventListener('error',()=>{if(v.getAttribute('src'))fail()});
  v.addEventListener('pause',()=>box.classList.add('paused'));v.addEventListener('play',()=>box.classList.remove('paused'));
  v.addEventListener('timeupdate',()=>{if(live)return;seek.value=v.duration?v.currentTime/v.duration*1000:0;$('[data-t=cur]',box).textContent=fmt(v.currentTime);$('[data-t=dur]',box).textContent=fmt(v.duration)});
  if(seek)seek.oninput=()=>{if(v.duration)v.currentTime=seek.value/1000*v.duration};
  $('.vol',box).oninput=e=>{v.volume=+e.target.value;v.muted=false};
  ql.onchange=()=>{if(hls)hls.currentLevel=+ql.value};
  box.onclick=e=>{const c=e.target.closest('[data-c]')?.dataset.c,o=e.target.closest('[data-o]')?.dataset.o;
    if(c==='pp')v.paused?v.play().catch(()=>{}):v.pause();
    if(c==='mu'){v.muted=!v.muted;e.target.textContent=v.muted?'✕':'♪'}
    if(c==='fs'){if(document.fullscreenElement||document.webkitFullscreenElement)(document.exitFullscreen||document.webkitExitFullscreen).call(document);
      else if(box.requestFullscreen)box.requestFullscreen();else if(box.webkitRequestFullscreen)box.webkitRequestFullscreen();else if(v.webkitEnterFullscreen)v.webkitEnterFullscreen()}
    if(o==='retry')start();if(o==='next'){si=(si+1)%list.length;start()}};
  const online=()=>{if(!dead&&list.length&&!ov.classList.contains('show')===false)start()};window.addEventListener('online',online);
  return{load(l){list=l||[];si=0;start()},idle(h){clean();show(h)},
    destroy(){dead=true;window.removeEventListener('online',online);clean();box.onclick=null;box.innerHTML=''}}}
function killP(){if(P){P.destroy();P=null}}

const IMG='https://image.tmdb.org/t/p/';
async function tmdb(path,p={}){if(!key)throw new Error('nokey');
  const u=new URL('https://api.themoviedb.org/3'+path);u.searchParams.set('api_key',key);u.searchParams.set('language','es-MX');
  for(const k in p)if(p[k]!==''&&p[k]!=null)u.searchParams.set(k,p[k]);
  if(memo.has(u.href))return memo.get(u.href);                       // caché de sesión
  const r=await fetch(u.href);if(!r.ok)throw new Error(r.status===401?'badkey':'HTTP '+r.status);
  const j=await r.json();memo.set(u.href,j);return j}
const norm=(k,x)=>({k,id:x.id,title:x.title||x.name,poster:x.poster_path,year:(x.release_date||x.first_air_date||'').slice(0,4),gen:x.genre_ids||[]});
const keyBox=()=>`<div class="note"><b>Conecta TMDB para ver el catálogo</b><p>Necesitas tu propia clave gratuita de API v3 (themoviedb.org → Ajustes → API). Se guarda únicamente en este navegador.</p><div class="acts"><input class="in" id="kin" placeholder="Clave API v3 (32 caracteres)" autocomplete="off"><button class="btn gold" data-a="savekey">Guardar</button></div></div>`;
const errBox=e=>e.message==='nokey'?keyBox():e.message==='badkey'?'<p class="mut">La clave de TMDB no es válida.</p>'+keyBox():`<p class="mut">No se pudo cargar TMDB (${esc(e.message)}).</p>`;
function card(m){MED[m.k+m.id]=m;
  return `<div class="card" data-a="open" data-k="${m.k}" data-id="${m.id}">${m.poster?`<img loading="lazy" src="${IMG}w342${m.poster}" alt="Póster de ${esc(m.title)}">`:'<div class="np">Sin póster</div>'}<b>${esc(m.title)}</b><small>${esc(m.year)}</small><button class="fv ${isFav(m.k,m.id)?'on':''}" data-a="fav" data-k="${m.k}" data-id="${m.id}" aria-label="Favorito">★</button></div>`}

      return `<div class="ep"><span><b>E${e.episode_number} · ${esc(e.name)}</b><small>${esc((e.overview||'').slice(0,140))}${e.runtime?' · '+e.runtime+' min':''}</small></span>${s&&s.length?`<button class="btn gold" data-a="playsrc" data-r="e:${id}-${n}-${e.episode_number}">▶</button>`:'<small>Sin fuente autorizada</small>'}</div>`}).join('')||'<p class="mut">Sin episodios.</p>'}
  catch(e){el.innerHTML=errBox(e)}}
function playSrc(r){const [t,k]=r.split(':');const list=t==='m'?CONFIG.playback.movie[k]:CONFIG.playback.episode[k];if(!list)return;
  const mp=$('#mp');mp.hidden=false;if(MP)MP.destroy();MP=mkPlayer(mp,{live:false});MP.load(list);mp.scrollIntoView({block:'nearest'})}
function showSources(){modal(`<h2 style="margin-top:0">Fuentes y limitaciones</h2>
  <table>${CONFIG.channelSources.map(s=>`<tr><td><b>${esc(s.cat)}</b></td><td><a href="${esc(s.url)}" target="_blank" rel="noopener noreferrer">${esc(s.url.replace(BASE,'iptv-org/'))}</a></td></tr>`).join('')}
  ${CONFIG.external.map(e=>`<tr><td><b>${esc(e.name)}</b></td><td>${esc(e.status)}. ${esc(e.how)}</td></tr>`).join('')}
  <tr><td><b>Películas y series</b></td><td>Metadatos de TMDB. La reproducción está <b>pendiente de autorización</b>: conéctala en <code>CONFIG.playback</code> solo con dominio público o proveedores que permitan incrustar.</td></tr></table>
  <h3>Limitaciones</h3><p class="mut" style="font-size:12px;line-height:1.6">· Las señales de IPTV-org son aportadas por la comunidad: no se verificó la licencia ni que cada una funcione. Muchas caen, tienen restricción regional o no envían CORS, y el navegador las bloqueará.<br>· En GitHub Pages (HTTPS) solo se reproducen señales HTTPS; las HTTP se descartan por contenido mixto.<br>· No se usan proxies para saltar restricciones de terceros.<br>· La guía EPG se activa al definir <code>epgUrl</code> (XMLTV con CORS).</p>`)}

/* ============================================================================
   8. EVENTOS, APARIENCIA Y ARRANQUE
   ============================================================================ */
function toggleFav(k,id){const store=favs[k];
  if(store[id])delete store[id];
  else{const o=k==='ch'?byId[id]:MED[k+id];if(!o)return;store[id]=o}
  LS.set('wtv-favs',favs);
  $$(`.fv[data-k="${k}"][data-id="${CSS.escape(id)}"]`).forEach(b=>b.classList.toggle('on',!!store[id]));
  const mb=$('.fv-m[data-id="'+id+'"]');if(mb){mb.classList.toggle('on',!!store[id]);mb.textContent=store[id]?'★ Quitar de favoritos':'☆ Favorito'}
  if(curCh&&k==='ch'&&curCh.id===id&&$('#cinfo'))info(curCh);
  if(view==='favs')vFavs();else if(view==='tv'&&tvCat==='★ Favoritos')loadList()}
const pref=LS.get('wtv-pref',{theme:'dark',glass:100});
function applyPref(){const r=document.documentElement;pref.theme==='dark'?r.removeAttribute('data-theme'):r.setAttribute('data-theme',pref.theme);r.style.setProperty('--g',pref.glass/100);
  $('#gv').textContent=pref.glass+'%';$('#glass').value=pref.glass;$$('[data-th]').forEach(b=>b.classList.toggle('on',b.dataset.th===pref.theme))}
document.addEventListener('click',e=>{
  if(e.target.id==='modal')return closeModal();
  const t=e.target.closest('[data-th]');if(t){pref.theme=t.dataset.th;LS.set('wtv-pref',pref);return applyPref()}
  const el=e.target.closest('[data-a]');if(!el){if(!e.target.closest('#ap'))$('#ap').classList.remove('open');return}
  const d=el.dataset;
  switch(d.a){
    case'go':closeModal();go(d.v);break;
    case'ap':$('#ap').classList.toggle('open');break;
    case'src':showSources();break;
    case'close':closeModal();break;
    case'cat':tvCat=d.c;$$('#cats .chip').forEach(c=>c.classList.toggle('on',c.dataset.c===tvCat));loadList();break;
    case'catgo':tvCat=d.c;go('tv');break;
    case'reload':loadList();break;
    case'play':{const ch=byId[d.id];if(ch)playCh(ch);break}
    case'resume':playCh(LS.get('wtv-last',null));break;
    case'fav':e.stopPropagation();toggleFav(d.k,d.id);break;
    case'open':openMedia(d.k,d.id);break;
    case'more':F[mk].page++;loadMedia(mk,false);break;
    case'playsrc':playSrc(d.r);break;
    case'savekey':{const v=($('#kin').value||'').trim();if(!/^[a-f0-9]{32}$/i.test(v)){$('#kin').style.borderColor='#e11d48';$('#kin').placeholder='Clave inválida (32 caracteres hex)';$('#kin').value='';break}
      key=v;LS.set('wtv-key',v);memo.clear();closeModal();go(view);break}}});
let tmr;
document.addEventListener('input',e=>{const id=e.target.id;
  if(id==='glass'){pref.glass=+e.target.value;LS.set('wtv-pref',pref);applyPref()}
  else if(id==='cq')loadList();
  else if(id==='mq'){clearTimeout(tmr);tmr=setTimeout(()=>{F[mk].q=e.target.value.trim();loadMedia(mk,true)},350)}
  else if(id==='q'){clearTimeout(tmr);tmr=setTimeout(()=>{if(e.target.value.trim())go('search');else if(view==='search')go('home')},350)}});
document.addEventListener('change',e=>{if(e.target.id==='mgen'){F[mk].genre=e.target.value;loadMedia(mk,true)}
  else if(e.target.id==='myr'){F[mk].year=e.target.value;loadMedia(mk,true)}
  else if(e.target.id==='ssel')loadSeason(e.target.dataset.id,e.target.value)});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
function fit(){const m=innerWidth<=900,f=$('#frame');document.documentElement.classList.toggle('m',m);
  if(m){f.style.transform='';return}
  const s=Math.min(innerWidth/1303,innerHeight/608);f.style.transform=`scale(${s})`;f.style.left=(innerWidth-1303*s)/2+'px';f.style.top=(innerHeight-608*s)/2+'px'}
addEventListener('resize',fit);fit();applyPref();go('home');
})();
</script>
